[project]
name = "trailhead"
version = "0.1.0"
description = "Local-first Streamlit app that turns a few taps into a short outdoor outing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.15"
dependencies = [
    "streamlit>=1.40",
    "httpx>=0.27",
    "ollama>=0.4",
    "pydantic>=2.8",
    "fpdf2>=2.7",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "N802", # Function name should be lowercase (we use some PascalCase for type names)
]

[tool.ruff.lint.isort]
known-first-party = ["trailhead"]